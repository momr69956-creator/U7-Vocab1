<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shubbaak Dialect Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Scheherazade+New:wght@400;500;600&display=swap">

<style>
:root{
  --bg:#FAF8F4;
  --surface:#FFFFFF;
  --ink:#1F1D1A;
  --ink-2:#4A463F;
  --muted:#8B857A;
  --line:#E9E4DB;
  --line-soft:#F1ECE4;
  --accent:#0F6F5C;
  --accent-ink:#0B5748;
  --accent-soft:#E6F1ED;
  --track:#EFEAE1;
  --good:#0F6F5C;
  --bad:#B0442F;
  --bad-soft:#FBEDE9;
  --sans:"Instrument Sans", ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
  --arabic:"Scheherazade New", "Scheherazade", "Noto Naskh Arabic", "Geeza Pro", "Traditional Arabic", serif;
  --shadow:0 1px 2px rgba(31,29,26,.05), 0 8px 24px -12px rgba(31,29,26,.12);
}

*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* ---------- header ---------- */
.top{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
  background:var(--surface);
  border-bottom:1px solid var(--line);
}
body::before{
  content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;
  background:var(--surface);
}
.top-in{
  max-width:1180px;margin:0 auto;padding:18px 28px 0;
  display:flex;align-items:flex-start;justify-content:space-between;gap:24px;flex-wrap:wrap;
}
.brand h1{margin:0;font-size:22px;font-weight:600;letter-spacing:-.01em}
.brand .meta{
  margin-top:5px;font-size:10.5px;font-weight:500;letter-spacing:.13em;
  text-transform:uppercase;color:var(--muted);
}
.dialect-tabs{display:flex;gap:4px;margin-left:auto}
.dtab{
  padding:6px 18px 12px;text-align:center;border-bottom:2px solid transparent;
  color:var(--ink-2);border-radius:6px 6px 0 0;transition:color .15s,background .15s;
}
.dtab:hover{background:var(--line-soft)}
.dtab .dt-name{display:block;font-size:15px;font-weight:600;line-height:1.2}
.dtab .dt-sub{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.dtab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);background:none}
.dtab[aria-selected="true"] .dt-sub{color:var(--accent)}

.toolbar{
  max-width:1180px;margin:0 auto;padding:12px 28px 14px;
  display:flex;align-items:center;gap:18px;flex-wrap:wrap;
}
.now-label{
  font-size:10.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted);min-width:64px;
}
.seg{display:flex;gap:2px;background:var(--track);padding:3px;border-radius:9px}
.seg button{
  padding:6px 18px;border-radius:7px;font-size:14px;font-weight:500;color:var(--ink-2);
  transition:background .15s,color .15s,box-shadow .15s;
}
.seg button:hover{color:var(--ink)}
.seg button[aria-selected="true"]{
  background:var(--surface);color:var(--ink);font-weight:600;
  box-shadow:0 1px 2px rgba(31,29,26,.10);
}
.switches{display:flex;gap:20px;margin-left:auto;flex-wrap:wrap}
.sw{display:flex;align-items:center;gap:9px;font-size:14px;color:var(--ink-2);cursor:pointer;user-select:none}
.sw input{position:absolute;opacity:0;width:0;height:0}
.box{
  width:15px;height:15px;border-radius:4px;border:1.5px solid #C9C2B6;background:var(--surface);
  display:grid;place-items:center;flex:none;transition:background .12s,border-color .12s;
}
.box svg{opacity:0;width:10px;height:10px}
.sw input:checked + .box{background:var(--accent);border-color:var(--accent)}
.sw input:checked + .box svg{opacity:1}
.sw input:focus-visible + .box{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- page ---------- */
main{max-width:880px;margin:0 auto;padding:38px 24px 90px}
.section-head{text-align:center;margin-bottom:26px}
.section-head h2{
  margin:0;font-size:27px;font-weight:600;letter-spacing:-.01em;
  display:flex;align-items:baseline;justify-content:center;gap:12px;flex-wrap:wrap;
}
.section-head .ar-name{font-family:var(--arabic);font-size:40px;color:var(--accent);font-weight:500;line-height:1}
.count{margin-top:8px;font-size:13px;color:var(--muted)}

.search{
  display:block;width:100%;max-width:420px;margin:0 auto 26px;
  padding:11px 16px;border:1px solid var(--line);border-radius:10px;
  background:var(--surface);font-size:15px;color:var(--ink);
}
.search::placeholder{color:#A9A296}
.search:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

.card-list{
  background:var(--surface);border:1px solid var(--line);border-radius:14px;
  overflow:hidden;box-shadow:var(--shadow);
}
.row{
  display:flex;align-items:center;gap:18px;padding:16px 22px;
  border-top:1px solid var(--line-soft);
}
.row:first-child{border-top:0}
.row .idx{
  font-size:12px;color:#B3ACA0;font-variant-numeric:tabular-nums;width:20px;flex:none;text-align:right;
}
.row .en{flex:1;min-width:0}
.row .en b{display:block;font-size:16px;font-weight:600;line-height:1.35}
.row .en span{display:block;font-size:13px;color:var(--muted);margin-top:1px}
.ar-wrap{text-align:right;direction:rtl;min-width:0}
.ar{font-family:var(--arabic);font-size:34px;font-weight:500;line-height:1.45;display:block}
.tr{font-size:13px;font-style:italic;color:var(--muted);direction:ltr;display:block;margin-top:2px}

.play{
  width:36px;height:36px;flex:none;border-radius:50%;
  background:var(--accent-soft);color:var(--accent);
  display:grid;place-items:center;transition:transform .12s,background .15s;
}
.play:hover{background:#D8E9E3}
.play:active{transform:scale(.92)}
.play.on{background:var(--accent);color:#fff}
.play svg{width:17px;height:17px}
.play[disabled]{opacity:.3;cursor:not-allowed}

/* toggles */
.hide-tr .tr{visibility:hidden}
.blur-en .row .en,
.blur-en .q-en{filter:blur(5px);transition:filter .15s}
.blur-en .row:hover .en,
.blur-en .row:focus-within .en,
.blur-en .q-en:hover{filter:none}

/* sentences */
.sent-block{margin-top:34px}
.sent-block h3{
  margin:0 0 12px;font-size:11px;font-weight:600;letter-spacing:.13em;
  text-transform:uppercase;color:var(--muted);text-align:center;
}
.sent-row{display:flex;align-items:center;gap:16px;padding:14px 22px;border-top:1px solid var(--line-soft)}
.sent-row:first-of-type{border-top:0}
.sent-row .ar-wrap{flex:1}
.sent-row .ar{font-size:31px;font-weight:400;line-height:1.55}

.empty{padding:34px;text-align:center;color:var(--muted);font-size:15px}

/* ---------- flashcards ---------- */
.fc-stage{display:flex;flex-direction:column;align-items:center;gap:20px}
.fc{width:100%;max-width:520px;min-height:280px;perspective:1400px;cursor:pointer}
.fc-inner{
  position:relative;width:100%;height:280px;transition:transform .5s cubic-bezier(.4,.1,.2,1);
  transform-style:preserve-3d;
}
.fc.flipped .fc-inner{transform:rotateY(180deg)}
.fc-face{
  position:absolute;inset:0;backface-visibility:hidden;
  background:var(--surface);border:1px solid var(--line);border-radius:18px;
  box-shadow:var(--shadow);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:30px;
}
.fc-back{transform:rotateY(180deg)}
.fc-face .tag{
  position:absolute;top:14px;left:18px;font-size:10px;font-weight:600;
  letter-spacing:.13em;text-transform:uppercase;color:var(--muted);
}
.fc-en{font-size:29px;font-weight:600;text-align:center;text-wrap:balance;line-height:1.25}
.fc-note{font-size:14px;color:var(--muted);margin-top:-8px}
.fc-ar{font-family:var(--arabic);font-size:68px;font-weight:500;line-height:1.35;direction:rtl;text-align:center}
.fc-tr{font-size:17px;font-style:italic;color:var(--muted)}
.fc-hint{font-size:12.5px;color:#B3ACA0}
.fc-controls{display:flex;align-items:center;gap:10px}
.btn{
  padding:9px 18px;border-radius:9px;border:1px solid var(--line);background:var(--surface);
  font-size:14px;font-weight:500;color:var(--ink-2);transition:border-color .15s,color .15s,background .15s;
}
.btn:hover{border-color:#D5CEC2;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-ink);border-color:var(--accent-ink);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.fc-pos{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:66px;text-align:center}
.fc-bar{width:100%;max-width:520px;height:3px;background:var(--track);border-radius:2px;overflow:hidden}
.fc-bar i{display:block;height:100%;background:var(--accent);transition:width .3s}

/* ---------- quiz ---------- */
.quiz{max-width:620px;margin:0 auto}
.q-top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}
.q-step{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.q-score{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.q-bar{height:3px;background:var(--track);border-radius:2px;overflow:hidden;margin-bottom:26px}
.q-bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.q-card{
  background:var(--surface);border:1px solid var(--line);border-radius:16px;
  padding:28px;box-shadow:var(--shadow);
}
.q-prompt{font-size:13px;color:var(--muted);text-align:center;margin-bottom:14px}
.q-subject{text-align:center;margin-bottom:24px}
.q-ar{font-family:var(--arabic);font-size:56px;font-weight:500;line-height:1.35;direction:rtl}
.q-en{font-size:26px;font-weight:600;line-height:1.3;text-wrap:balance}
.q-audio{margin:6px auto 0}
.q-audio.big{width:64px;height:64px}
.q-audio.big svg{width:26px;height:26px}
.opts{display:grid;gap:9px}
.opt{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:13px 16px;border:1px solid var(--line);border-radius:11px;background:var(--surface);
  font-size:16px;transition:border-color .15s,background .15s;
}
.opt:hover:not(:disabled){border-color:#C6BFB2;background:#FDFCFA}
.opt .k{
  font-size:11px;font-weight:600;color:var(--muted);border:1px solid var(--line);
  border-radius:5px;width:20px;height:20px;display:grid;place-items:center;flex:none;
}
.opt .txt{flex:1}
.opt .txt.ar{font-size:32px;direction:rtl;text-align:right;line-height:1.45}
.opt.right{border-color:var(--accent);background:var(--accent-soft)}
.opt.right .k{border-color:var(--accent);color:var(--accent)}
.opt.wrong{border-color:#E2B8AC;background:var(--bad-soft)}
.opt.wrong .k{border-color:#E2B8AC;color:var(--bad)}
.opt:disabled{cursor:default}
.q-foot{margin-top:20px;display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:40px}
.q-verdict{font-size:14px;font-weight:500}
.q-verdict.right{color:var(--good)}
.q-verdict.wrong{color:var(--bad)}
.q-verdict small{display:block;font-weight:400;color:var(--muted);margin-top:2px}
.bidi-ar{direction:rtl;unicode-bidi:isolate;font-family:var(--arabic);font-size:21px}

.result{text-align:center;padding:14px 0}
.result .big{font-size:52px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.result .of{font-size:15px;color:var(--muted);margin-top:2px}
.result .line{font-size:15px;color:var(--ink-2);margin:18px auto 22px;max-width:34ch;text-wrap:balance}
.missed{
  margin-top:8px;text-align:left;border-top:1px solid var(--line-soft);padding-top:16px;
  display:grid;gap:8px;
}
.missed h4{margin:0 0 4px;font-size:11px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.missed div{display:flex;justify-content:space-between;align-items:baseline;gap:16px;font-size:15px}
.missed .m-ar{font-family:var(--arabic);font-size:29px;direction:rtl;line-height:1.4}

@media (max-width:720px){
  .top-in{padding:14px 18px 0}
  .dialect-tabs{margin-left:0;width:100%;justify-content:space-between}
  .dtab{flex:1;padding:6px 8px 10px}
  .toolbar{padding:10px 18px 12px;gap:12px}
  .now-label{display:none}
  .switches{margin-left:0;width:100%;gap:16px}
  main{padding:28px 16px 70px}
  .row{gap:12px;padding:14px 16px}
  .row .idx{display:none}
  .ar{font-size:31px}
  .sent-row .ar{font-size:28px}
  .fc-inner{height:250px}
  .fc-ar{font-size:56px}
  .q-card{padding:20px}
  .q-ar{font-size:47px}
  .opt .txt.ar{font-size:29px}
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms !important;animation-duration:.01ms !important}
}
</style>

</head>

  </div>
</header>

<main id="main"></main>

const DIALECTS = DECK.dialects;
const WORDS = DECK.words;
const SENTENCES = DECK.sentences || {};

/* ---------- audio ---------- */
const player = new Audio();
let playingBtn = null;
let playSeq = 0;
function clearPlaying(){ if(playingBtn){ playingBtn.classList.remove("on"); playingBtn = null; } }

function play(key, btn){
  const data = AUDIO[key];
  if(!data) return;
  const mine = ++playSeq;
  clearPlaying();
  player.pause();
  player.src = "data:audio/mpeg;base64," + data;
  player.currentTime = 0;
  if(btn){ btn.classList.add("on"); playingBtn = btn; }
  const done = () => { if(mine === playSeq) clearPlaying(); };
  player.onended = done;
  player.onerror = done;
  const p = player.play();
  if(p && p.catch) p.catch(done);
}

const SPEAKER = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M11 5 6.5 9H3v6h3.5L11 19V5Z" fill="currentColor"/><path d="M15.6 8.6a4.6 4.6 0 0 1 0 6.8M18.4 5.8a8.5 8.5 0 0 1 0 12.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';

function audioBtn(key, label, cls){
  const b = document.createElement("button");
  b.className = "play" + (cls ? " " + cls : "");
  b.innerHTML = SPEAKER;
  b.setAttribute("aria-label", "Play " + label);
  if(!AUDIO[key]) b.disabled = true;
  b.addEventListener("click", e => { e.stopPropagation(); play(key, b); });
  return b;
}

/* ---------- state ---------- */
const state = { dialect:DIALECTS[0].id, view:"words", query:"", card:0, flipped:false, order:null };
const pad = n => String(n).padStart(2,"0");
const entry = (w,i,d) => ({ i, en:w.en, note:w.note||"", ar:(w.forms[d]||["",""])[0], tr:(w.forms[d]||["",""])[1], key:d + "-" + pad(i) });
const deck = d => WORDS.map((w,i)=>entry(w,i,d));
const meta = () => DIALECTS.find(d=>d.id===state.dialect);
const sents = () => SENTENCES[state.dialect] || [];

/* ---------- header ---------- */
const dtabs = document.getElementById("dtabs");
DIALECTS.forEach(d=>{
  const b = document.createElement("button");
  b.className = "dtab";
  b.setAttribute("role","tab");
  b.dataset.id = d.id;
  b.innerHTML = '<span class="dt-name"></span><span class="dt-sub"></span>';
  b.querySelector(".dt-name").textContent = d.name;
  b.querySelector(".dt-sub").textContent = d.sub || "";
  b.addEventListener("click", ()=>{
    if(state.dialect === d.id) return;
    state.dialect = d.id; state.card = 0; state.flipped = false; state.order = null;
    quiz = null;
    syncHead(); render();
  });
  dtabs.appendChild(b);
});

document.getElementById("views").addEventListener("click", e=>{
  const b = e.target.closest("button[data-view]");
  if(!b || b.dataset.view === state.view) return;
  state.view = b.dataset.view;
  syncHead(); render();
});

document.getElementById("tgTr").addEventListener("change", e=>{
  document.body.classList.toggle("hide-tr", e.target.checked);
});
document.getElementById("tgEn").addEventListener("change", e=>{
  document.body.classList.toggle("blur-en", e.target.checked);
});

function syncHead(){
  [...dtabs.children].forEach(b=>b.setAttribute("aria-selected", b.dataset.id === state.dialect));
  [...document.getElementById("views").children].forEach(b=>b.setAttribute("aria-selected", b.dataset.view === state.view));
  document.getElementById("nowLabel").textContent = meta().name;
}

function sectionHead(sub){
  const m = meta();
  const h = document.createElement("div");
  h.className = "section-head";
  const h2 = document.createElement("h2");
  const arName = document.createElement("span");
  arName.className = "ar-name";
  arName.textContent = m.ar || "";
  const enName = document.createElement("span");
  enName.textContent = m.name;
  h2.append(arName, enName);
  h.appendChild(h2);
  if(sub){
    const c = document.createElement("div");
    c.className = "count";
    c.textContent = sub;
    h.appendChild(c);
  }
  return h;
}

/* ---------- words ---------- */
function viewWords(root){
  const ns = sents().length;
  root.appendChild(sectionHead(WORDS.length + " words" + (ns ? " · " + ns + " example sentence" + (ns > 1 ? "s" : "") : "")));

  const search = document.createElement("input");
  search.className = "search";
  search.type = "search";
  search.placeholder = "Search meaning, Arabic or transliteration…";
  search.value = state.query;
  search.setAttribute("aria-label","Search this list");
  root.appendChild(search);

  const list = document.createElement("div");
  list.className = "card-list";
  root.appendChild(list);

  function fill(){
    list.innerHTML = "";
    const q = state.query.trim().toLowerCase();
    const items = deck(state.dialect).filter(e=>{
      if(!q) return true;
      return (e.en+" "+e.note+" "+e.ar+" "+e.tr).toLowerCase().includes(q);
    });
    if(!items.length){
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "Nothing matches “" + state.query + "”.";
      list.appendChild(empty);
      return;
    }
    items.forEach(e=>{
      const row = document.createElement("div");
      row.className = "row";
      row.innerHTML =
        '<div class="idx">'+(e.i+1)+'</div>' +
        '<div class="en"><b></b>'+(e.note ? '<span></span>' : '')+'</div>' +
        '<div class="ar-wrap"><span class="ar"></span><span class="tr"></span></div>';
      row.querySelector(".en b").textContent = e.en;
      if(e.note) row.querySelector(".en span").textContent = e.note;
      row.querySelector(".ar").textContent = e.ar;
      row.querySelector(".tr").textContent = e.tr;
      row.appendChild(audioBtn(e.key, e.en));
      list.appendChild(row);
    });
  }
  fill();
  search.addEventListener("input", ()=>{ state.query = search.value; fill(); });

  if(sents().length){
    const block = document.createElement("div");
    block.className = "sent-block";
    const h3 = document.createElement("h3");
    h3.textContent = "Example sentences";
    block.appendChild(h3);
    const box = document.createElement("div");
    box.className = "card-list";
    sents().forEach(s=>{
      const r = document.createElement("div");
      r.className = "sent-row";
      const wrap = document.createElement("div");
      wrap.className = "ar-wrap";
      wrap.innerHTML = '<span class="ar"></span><span class="tr"></span>';
      wrap.querySelector(".ar").textContent = s.ar;
      wrap.querySelector(".tr").textContent = s.tr || "";
      r.appendChild(wrap);
      r.appendChild(audioBtn(s.key, "sentence"));
      box.appendChild(r);
    });
    block.appendChild(box);
    root.appendChild(block);
  }
}

/* ---------- flashcards ---------- */
function shuffled(n){
  const a = [...Array(n).keys()];
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; }
  return a;
}

function viewCards(root){
  root.appendChild(sectionHead("Tap the card to flip · ← → to move"));
  const items = deck(state.dialect);
  if(!state.order) state.order = [...Array(items.length).keys()];

  const stage = document.createElement("div");
  stage.className = "fc-stage";

  const bar = document.createElement("div");
  bar.className = "fc-bar";
  bar.innerHTML = "<i></i>";

  const fc = document.createElement("div");
  fc.className = "fc";
  fc.tabIndex = 0;
  fc.setAttribute("role","button");
  fc.innerHTML =
    '<div class="fc-inner">' +
      '<div class="fc-face fc-front"><span class="tag">Meaning</span><div class="fc-en"></div><div class="fc-note"></div><div class="fc-hint">Tap to reveal</div></div>' +
      '<div class="fc-face fc-back"><span class="tag"></span><div class="fc-ar"></div><div class="fc-tr"></div></div>' +
    '</div>';
  const backFace = fc.querySelector(".fc-back");

  const controls = document.createElement("div");
  controls.className = "fc-controls";
  const prev = document.createElement("button"); prev.className = "btn"; prev.textContent = "← Back";
  const pos = document.createElement("div"); pos.className = "fc-pos";
  const next = document.createElement("button"); next.className = "btn primary"; next.textContent = "Next →";
  const shuf = document.createElement("button"); shuf.className = "btn"; shuf.textContent = "Shuffle";
  controls.append(prev, pos, next, shuf);

  stage.append(fc, bar, controls);
  root.appendChild(stage);

  let audioNode = null;
  function draw(){
    const e = items[state.order[state.card]];
    fc.classList.toggle("flipped", state.flipped);
    fc.querySelector(".fc-en").textContent = e.en;
    fc.querySelector(".fc-note").textContent = e.note || "";
    fc.querySelector(".fc-ar").textContent = e.ar;
    fc.querySelector(".fc-tr").textContent = e.tr;
    backFace.querySelector(".tag").textContent = meta().name;
    if(audioNode) audioNode.remove();
    audioNode = audioBtn(e.key, e.en);
    backFace.appendChild(audioNode);
    pos.textContent = (state.card+1) + " / " + items.length;
    bar.querySelector("i").style.width = ((state.card+1)/items.length*100) + "%";
    prev.disabled = state.card === 0;
    next.disabled = state.card === items.length-1;
    fc.setAttribute("aria-label", (state.flipped ? "Showing " + e.ar : "Meaning: " + e.en) + ". Activate to flip.");
  }
  function flip(){ state.flipped = !state.flipped; draw(); if(state.flipped) play(items[state.order[state.card]].key, audioNode); }
  function go(step){
    const n = state.card + step;
    if(n < 0 || n >= items.length) return;
    state.card = n; state.flipped = false; draw();
  }

  fc.addEventListener("click", flip);
  fc.addEventListener("keydown", e=>{ if(e.key === " " || e.key === "Enter"){ e.preventDefault(); flip(); } });
  prev.addEventListener("click", ()=>go(-1));
  next.addEventListener("click", ()=>go(1));
  shuf.addEventListener("click", ()=>{ state.order = shuffled(items.length); state.card = 0; state.flipped = false; draw(); });
  draw();

  root._keys = e=>{
    if(e.key === "ArrowRight"){ go(1); }
    else if(e.key === "ArrowLeft"){ go(-1); }
    else if(e.key === " " && e.target === document.body){ e.preventDefault(); flip(); }
  };
}

/* ---------- quiz ---------- */
let quiz = null;
const QN = 10;

function buildQuiz(){
  const items = deck(state.dialect);
  const order = shuffled(items.length).slice(0, Math.min(QN, items.length));
  return {
    qs: order.map((idx,n)=>{
      const target = items[idx];
      let kind = ["ar","en","listen"][n % 3];
      if(kind === "listen" && !AUDIO[target.key]) kind = "ar";
      const pool = items.filter(e=>e.en !== target.en && e.ar !== target.ar);
      const picks = shuffled(pool.length).slice(0,3).map(i=>pool[i]);
      const opts = shuffled(Math.min(4, 1 + picks.length)).map(i=>[target,...picks][i]);
      return {kind, target, opts, answer:null};
    }),
    at:0, score:0
  };
}

function viewQuiz(root){
  if(!quiz) quiz = buildQuiz();
  const wrap = document.createElement("div");
  wrap.className = "quiz";
  root.appendChild(wrap);
  drawQuiz(wrap);
}

function drawQuiz(wrap){
  wrap.innerHTML = "";
  if(quiz.at >= quiz.qs.length){ drawResult(wrap); return; }

  const q = quiz.qs[quiz.at];

  const top = document.createElement("div");
  top.className = "q-top";
  top.innerHTML = '<div class="q-step">Question '+(quiz.at+1)+' of '+quiz.qs.length+'</div>' +
                  '<div class="q-score">'+quiz.score+' correct</div>';
  const bar = document.createElement("div");
  bar.className = "q-bar";
  bar.innerHTML = '<i style="width:'+(quiz.at/quiz.qs.length*100)+'%"></i>';

  const card = document.createElement("div");
  card.className = "q-card";

  const prompt = document.createElement("div");
  prompt.className = "q-prompt";
  const subject = document.createElement("div");
  subject.className = "q-subject";

  if(q.kind === "ar"){
    prompt.textContent = "Which one means…";
    const en = document.createElement("div");
    en.className = "q-en";
    en.textContent = q.target.en + (q.target.note ? " (" + q.target.note + ")" : "");
    subject.appendChild(en);
  } else if(q.kind === "en"){
    prompt.textContent = "What does this mean?";
    const ar = document.createElement("div");
    ar.className = "q-ar";
    ar.textContent = q.target.ar;
    subject.appendChild(ar);
  } else {
    prompt.textContent = "Listen — what does it mean?";
    const b = audioBtn(q.target.key, "the word", "big q-audio");
    subject.appendChild(b);
    setTimeout(()=>play(q.target.key, b), 260);
  }

  const opts = document.createElement("div");
  opts.className = "opts";
  const letters = ["A","B","C","D"];
  q.opts.forEach((o,i)=>{
    const b = document.createElement("button");
    b.className = "opt";
    const isAr = q.kind === "ar";
    b.innerHTML = '<span class="k">'+letters[i]+'</span><span class="txt'+(isAr ? " ar" : "")+'"></span>';
    b.querySelector(".txt").textContent = isAr ? o.ar : (o.en + (o.note ? " (" + o.note + ")" : ""));
    b.addEventListener("click", ()=>answer(wrap, i));
    opts.appendChild(b);
  });

  const foot = document.createElement("div");
  foot.className = "q-foot";

  card.append(prompt, subject, opts, foot);
  wrap.append(top, bar, card);

  if(q.answer !== null) settle(wrap);
}

function answer(wrap, i){
  const q = quiz.qs[quiz.at];
  if(q.answer !== null) return;
  q.answer = i;
  if(q.opts[i] === q.target) quiz.score++;
  settle(wrap);
}

function settle(wrap){
  const q = quiz.qs[quiz.at];
  const btns = [...wrap.querySelectorAll(".opt")];
  btns.forEach((b,i)=>{
    b.disabled = true;
    if(q.opts[i] === q.target) b.classList.add("right");
    else if(i === q.answer) b.classList.add("wrong");
  });
  const ok = q.opts[q.answer] === q.target;
  const foot = wrap.querySelector(".q-foot");
  foot.innerHTML = "";
  const v = document.createElement("div");
  v.className = "q-verdict " + (ok ? "right" : "wrong");
  v.textContent = ok ? "Correct" : "Not quite";
  const small = document.createElement("small");
  const arSpan = document.createElement("span");
  arSpan.className = "bidi-ar";
  arSpan.textContent = q.target.ar;
  small.appendChild(arSpan);
  small.appendChild(document.createTextNode((q.target.tr ? " · " + q.target.tr : "") + " — " + q.target.en + (q.target.note ? " (" + q.target.note + ")" : "")));
  v.appendChild(small);
  const nextBtn = document.createElement("button");
  nextBtn.className = "btn primary";
  nextBtn.textContent = quiz.at === quiz.qs.length-1 ? "See score" : "Next →";
  nextBtn.addEventListener("click", ()=>{ quiz.at++; drawQuiz(wrap); });
  foot.append(v, audioBtn(q.target.key, q.target.en));
  foot.append(nextBtn);
  nextBtn.focus();
  wrap.querySelector(".q-score").textContent = quiz.score + " correct";
}

function drawResult(wrap){
  const total = quiz.qs.length;
  const missed = quiz.qs.filter(q=>q.opts[q.answer] !== q.target).map(q=>q.target);
  const card = document.createElement("div");
  card.className = "q-card";
  const res = document.createElement("div");
  res.className = "result";
  res.innerHTML =
    '<div class="big">'+quiz.score+'</div>' +
    '<div class="of">out of '+total+'</div>' +
    '<div class="line">'+(missed.length ? "Worth another pass on these:" : "Clean sweep — every one right.")+'</div>';

  if(missed.length){
    const m = document.createElement("div");
    m.className = "missed";
    const h4 = document.createElement("h4");
    h4.textContent = "Review";
    m.appendChild(h4);
    missed.forEach(t=>{
      const r = document.createElement("div");
      r.innerHTML = '<span></span><span class="m-ar"></span>';
      r.children[0].textContent = t.en + (t.note ? " (" + t.note + ")" : "") + (t.tr ? " · " + t.tr : "");
      r.children[1].textContent = t.ar;
      m.appendChild(r);
    });
    res.appendChild(m);
  }

  const again = document.createElement("button");
  again.className = "btn primary";
  again.style.marginTop = "22px";
  again.textContent = "Try again";
  again.addEventListener("click", ()=>{ quiz = buildQuiz(); drawQuiz(wrap); });
  res.appendChild(again);
  card.appendChild(res);
  wrap.appendChild(card);
}

/* ---------- render ---------- */
const main = document.getElementById("main");
let keyHandler = null;

function render(){
  player.pause();
  clearPlaying();
  if(keyHandler){ document.removeEventListener("keydown", keyHandler); keyHandler = null; }
  main.innerHTML = "";
  if(state.view === "words") viewWords(main);
  else if(state.view === "cards"){ viewCards(main); keyHandler = main._keys; document.addEventListener("keydown", keyHandler); }
  else viewQuiz(main);
  window.scrollTo({top:0, behavior:"instant"});
}

document.getElementById("deckTitle").textContent = DECK.lessonName;
document.getElementById("meta").textContent = DECK.source + " · " + WORDS.length + " words · one variety at a time";
syncHead();
render();
</script>
